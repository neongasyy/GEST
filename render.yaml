# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Backend only: a managed Postgres + the FastAPI API, built from the existing
# backend/Dockerfile (which already runs `alembic upgrade head` via
# entrypoint.sh before serving). The frontend stays on Vercel.
#
# Setup:
#   1. Push this file to the default branch.
#   2. Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
#   3. Once live, read SECRET_KEY / confirm DATABASE_URL under
#      gest-backend -> Environment.
#   4. *** Replace ALLOWED_ORIGINS and FRONTEND_URL below with your real
#      Vercel URL *** (placeholder: https://gest.vercel.app), then redeploy.
#   5. In the Vercel project's Environment Variables, set:
#        VITE_API_URL = https://gest-backend.onrender.com
#      and redeploy the frontend (VITE_API_URL is baked in at build time —
#      changing it in the dashboard alone does nothing until the next build).
#
# Notes:
#   - Free web services sleep after ~15 min idle; the next request wakes
#     them (~50s cold start). Free Postgres is deleted after 90 days.
#   - The service name sets the URL (https://<name>.onrender.com). If
#     "gest-backend" is taken in your account, rename it here and update
#     VITE_API_URL on Vercel to match.

databases:
  - name: gest-db
    plan: free
    databaseName: gest
    user: gest

services:
  - type: web
    name: gest-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://gest.vercel.app # TODO: replace with your real Vercel URL
      - key: FRONTEND_URL
        value: https://gest.vercel.app # TODO: replace with your real Vercel URL
